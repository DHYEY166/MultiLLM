<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MultiLLM - Models</title>
  <link rel="icon" href="./logo.png" type="image/png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div class="container nav">
      <div class="brand">
        <img src="./logo.png" alt="MultiLLM Logo" />
        <span>MultiLLM</span>
      </div>
      <a href="./">Chat</a>
      <a href="./analytics.html">Analytics</a>
      <a href="./models.html">Models</a>
      <a href="./plugins.html">Plugins</a>
      <a href="./admin.html">Admin</a>
    </div>
  </header>

  <main class="container">
    <div class="grid" style="grid-template-columns: 1fr;">
      <div class="panel">
        <div class="row wrap">
          <div class="badge">Ollama Models</div>
          <button id="refresh" class="right">Refresh</button>
        </div>
        <div class="spacer"></div>
        <div id="models"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { setActiveNav, $ } from './js/ui.js';
    import { listModels } from './js/llm.js';
    import authManager from './js/auth.js';
    import AuthGuard from './js/authGuard.js';

    // Protect this page - redirect to login if not authenticated
    await AuthGuard.protect(authManager);
    
    setActiveNav();

    const container = $('#models');

    async function render(){
      container.textContent = 'Loading…';
      try{
        const models = await listModels();
        if(!models.length){ container.textContent = 'No models found. Use `ollama pull` to download models.'; return; }
        const table = document.createElement('table');
        table.className = 'table mono small';
        table.innerHTML = '<thead><tr><th>Name</th><th>Size</th><th>Params</th><th>Modified</th></tr></thead><tbody></tbody>';
        const tbody = table.querySelector('tbody');
        for (const m of models){
          const tr = document.createElement('tr');
          const sizeMb = m.size ? Math.round(m.size/1024/1024)+'MB' : '-';
          const name = (m.name||m.model||'');
          const params = (m.details?.parameter_size||'');
          const modified = (m.modified || '').slice(0,19);
          tr.innerHTML = `<td>${name}</td><td>${sizeMb}</td><td>${params}</td><td>${modified}</td>`;
          tbody.appendChild(tr);
        }
        container.innerHTML = '';
        container.appendChild(table);
      }catch(e){
        container.textContent = 'Error: ' + (e?.message || String(e));
      }
    }

    render();
    $('#refresh').addEventListener('click', render);
  </script>
</body>
</html>
