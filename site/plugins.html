<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MultiLLM - Plugins</title>
  <link rel="icon" href="./logo.png" type="image/png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div class="container nav">
      <div class="brand">
        <img src="./logo.png" alt="MultiLLM Logo" />
        <span>MultiLLM</span>
      </div>
      <a href="./">Chat</a>
      <a href="./analytics.html">Analytics</a>
      <a href="./models.html">Models</a>
      <a href="./plugins.html">Plugins</a>
      <a href="./admin.html">Admin</a>
    </div>
  </header>

  <main class="container">
    <div class="grid" style="grid-template-columns: 1fr;">
      <div class="panel">
        <div class="row wrap">
          <div class="badge">Built-in Plugins</div>
        </div>
        <div class="spacer"></div>
        <div id="plugins"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { setActiveNav, $ } from './js/ui.js';
    import { listPlugins } from './js/plugins.js';
    import authManager from './js/auth.js';
    import AuthGuard from './js/authGuard.js';

    // Protect this page - redirect to login if not authenticated
    await AuthGuard.protect(authManager);
    
    setActiveNav();
    const container = $('#plugins');
    const data = listPlugins();
    if (!data.length){ container.textContent = 'No plugins registered.'; }
    const ul = document.createElement('ul');
    ul.style.listStyle = 'disc';
    ul.style.marginLeft = '18px';
    for (const p of data){
      const li = document.createElement('li');
      li.className = 'mono small';
      li.textContent = `${p.name}: ${p.description}`;
      ul.appendChild(li);
    }
    container.appendChild(ul);
  </script>
</body>
</html>
